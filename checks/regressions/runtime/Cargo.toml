[package]
name = "rust-skills-runtime-regressions"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "=1.52.3", features = ["full", "test-util"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }
anyhow = "=1.0.104"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
trait-variant = "=0.1.2"
secrecy = "=0.10.3"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "tracing-log"] }
log = { version = "=0.4.34", features = ["kv"] }
thiserror = "=2.0.21"
futures = "=0.3.32"
